@if (visible) {
  <div class="fixed inset-x-0 bottom-0 z-[200] border-t border-gray-300 bg-gray-100 p-2 shadow-2xl dark:border-gray-700 dark:bg-gray-900 sm:p-3">
    <div class="mb-2 flex items-center justify-between px-1">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500">POS Keyboard</span>
      <div class="flex gap-2">
        <button type="button" (click)="onDone()" class="key-btn rounded-md bg-brand-500 px-3 py-1.5 text-xs font-semibold text-white">Done</button>
        <button type="button" (click)="onClose()" class="key-btn rounded-md border border-gray-300 px-3 py-1.5 text-xs font-semibold text-gray-600 dark:border-gray-600 dark:text-gray-300">Hide</button>
      </div>
    </div>
    <div class="mx-auto max-w-4xl space-y-1.5">
      @for (row of rows; track $index) {
        <div class="flex justify-center gap-1.5">
          @for (key of row; track key) {
            <button type="button" (click)="press(key)"
              class="key-btn min-h-[44px] flex-1 rounded-md border border-gray-300 bg-white text-base font-medium text-gray-800 shadow-sm active:bg-gray-200 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:active:bg-gray-700"
              [class.max-w-[10%]]="mode === 'text'"
              [class.max-w-[28%]]="mode === 'numeric'">
              {{ key === ' ' ? 'Space' : key }}
            </button>
          }
        </div>
      }
      <div class="flex justify-center gap-1.5">
        <button type="button" (click)="onBackspace()"
          class="key-btn min-h-[44px] flex-1 max-w-[33%] rounded-md border border-gray-300 bg-white text-sm font-semibold text-gray-700 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200">
          ⌫ Back
        </button>
        <button type="button" (click)="onClear()"
          class="key-btn min-h-[44px] flex-1 max-w-[33%] rounded-md border border-red-200 bg-red-50 text-sm font-semibold text-red-600 dark:border-red-800 dark:bg-red-950 dark:text-red-300">
          Clear
        </button>
      </div>
    </div>
  </div>
}
