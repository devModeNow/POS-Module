@if (visible) {
  <div class="fixed inset-x-0 bottom-0 z-[100001] border-t border-gray-300 bg-gray-100 px-1 py-1 shadow-2xl dark:border-gray-700 dark:bg-gray-900">
    <div class="mb-1 flex items-center justify-between px-1">
      <span class="text-[10px] font-semibold uppercase tracking-wide text-gray-500">Keyboard</span>
      <div class="flex gap-1">
        <button type="button" (click)="onDone()" class="key-btn rounded bg-brand-500 px-2 py-0.5 text-[10px] font-semibold text-white">Done</button>
        <button type="button" (click)="onClose()" class="key-btn rounded border border-gray-300 px-2 py-0.5 text-[10px] font-semibold text-gray-600 dark:border-gray-600 dark:text-gray-300">Hide</button>
      </div>
    </div>
    <div class="mx-auto max-w-3xl space-y-0.5">
      @for (row of rows; track $index) {
        <div class="flex justify-center gap-0.5">
          @for (key of row; track key) {
            <button type="button" (click)="press(key)"
              class="key-btn min-h-[32px] flex-1 rounded border border-gray-300 bg-white text-xs font-medium text-gray-800 shadow-sm active:bg-gray-200 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:active:bg-gray-700"
              [class.max-w-[10%]]="mode === 'text'"
              [class.max-w-[28%]]="mode === 'numeric'">
              {{ key === ' ' ? '␣' : key }}
            </button>
          }
        </div>
      }
      <div class="flex justify-center gap-0.5">
        <button type="button" (click)="onBackspace()"
          class="key-btn min-h-[32px] flex-1 max-w-[33%] rounded border border-gray-300 bg-white text-[11px] font-semibold text-gray-700 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200">
          ⌫
        </button>
        <button type="button" (click)="onClear()"
          class="key-btn min-h-[32px] flex-1 max-w-[33%] rounded border border-red-200 bg-red-50 text-[11px] font-semibold text-red-600 dark:border-red-800 dark:bg-red-950 dark:text-red-300">
          Clear
        </button>
      </div>
    </div>
  </div>
}
