<div class="space-y-5" [class.p-4]="embedded">
  @if (loading) {
    <p class="text-sm text-gray-500">Loading printer settings…</p>
  } @else {
    @if (error) {
      <p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    }

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-600 dark:text-gray-300">Printer</label>
        <select [(ngModel)]="printerName" class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white">
          @for (opt of printerOptions; track opt) {
            <option [value]="opt">{{ opt }}</option>
          }
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-600 dark:text-gray-300">Receipt size</label>
        <select [(ngModel)]="paperWidth" class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white">
          <option value="58mm">58mm</option>
          <option value="80mm">80mm</option>
        </select>
      </div>
      <label class="flex items-center gap-2 text-sm md:col-span-2">
        <input type="checkbox" [(ngModel)]="showLogo" /> Show logo on receipt
      </label>
      <div class="md:col-span-2">
        <label class="mb-1 block text-xs font-semibold text-gray-600 dark:text-gray-300">Receipt footer</label>
        <input [(ngModel)]="footerText" placeholder="Thank you for your purchase!"
          class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
      </div>
    </div>

    <div>
      <h4 class="mb-2 text-sm font-semibold text-gray-800 dark:text-gray-100">Receipt template editor</h4>
      <app-pos-receipt-template-editor
        [paperWidth]="paperWidth"
        [logoUrl]="showLogo ? logoUrl : null"
        [elements]="templateElements"
        (elementsChange)="templateElements = $event" />
    </div>

    <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-700">
      <h4 class="mb-3 text-sm font-semibold text-gray-800 dark:text-gray-100">Print preview</h4>
      <div class="flex justify-center bg-gray-100 p-4 dark:bg-gray-950">
        <div class="relative h-[320px] w-full overflow-hidden rounded border border-gray-300 bg-white font-mono text-xs text-gray-800 dark:border-gray-700" [ngClass]="previewWidthClass">
          @for (el of templateElements; track el.id) {
            <div [ngStyle]="elementStyle(el)">
              @if (el.type === 'image') {
                <img [src]="el.content" alt="" class="object-contain" [style.width.%]="100" />
              } @else {
                <span class="whitespace-pre-line">{{ previewText(el) }}</span>
              }
            </div>
          }
          <p class="absolute bottom-1 left-0 right-0 text-center text-[10px] text-gray-500">{{ paperWidth }} · {{ printerName }}</p>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap justify-end gap-2">
      <button type="button" (click)="printPreview()" class="rounded-lg border px-4 py-2 text-sm font-semibold hover:bg-gray-50 dark:border-gray-700 dark:hover:bg-gray-800">Print preview</button>
      <button type="button" (click)="save()" [disabled]="saving"
        class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600 disabled:opacity-50">
        {{ saving ? 'Saving…' : 'Save printer settings' }}
      </button>
    </div>
  }
</div>
